name: caporal
description: Caporal, las cuentas de su negocio, con o sin señal.
publish_to: none
version: 0.1.0+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  http: ^1.2.2
  path: ^1.9.0
  uuid: ^4.5.1
  provider: ^6.1.2
  intl: ^0.20.3
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Ícono de la app (se genera con: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icono/icono.png"
  ios: true
  remove_alpha_ios: true
  android: "launcher_icon"
  min_sdk_android: 31
  adaptive_icon_background: "#1B7F4B"
  adaptive_icon_foreground: "assets/icono/icono_frente.png"

# Pantalla de arranque nativa (se genera con: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#1B7F4B"
  image: assets/icono/arranque.png
  android_12:
    color: "#1B7F4B"
    image: assets/icono/arranque_android12.png
